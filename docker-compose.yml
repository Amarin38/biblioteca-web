services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /data/biblioteca.db
      PDF_DIR: /pdfs
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-tp}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - ./data:/data
      - ./pdfs:/pdfs:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      - backend
